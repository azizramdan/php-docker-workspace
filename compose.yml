services:
  postgres14:
    image: postgres:14-alpine
    environment:
      - POSTGRES_PASSWORD=${POSTGRES14_PASSWORD}
    ports:
      - "${POSTGRES14_PORT}:5432"
    volumes:
      - ./postgres14/data:/var/lib/postgresql/data
      - "${PROJECT_PATH}:/projects"

  mysql84:
    image: mysql:8.4
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL84_ROOT_PASSWORD}
    ports:
      - "${MYSQL84_PORT}:3306"
    volumes:
      - ./mysql84:/var/lib/mysql
      - "${PROJECT_PATH}:/projects"

  nginx:
    image: nginx:alpine
    ports:
      - 80:80
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - "${PROJECT_PATH}:/projects"

  redis:
    image: redis:alpine

  php72:
    build:
      context: ./php
      dockerfile: php72.Dockerfile
      args:
        - PUID=${PUID}
        - PGID=${PGID}
    working_dir: /projects
    user: www
    volumes:
      - "${PROJECT_PATH}:/projects"
      - ./php/.bash_aliases:/home/www/.bash_aliases

  php74:
